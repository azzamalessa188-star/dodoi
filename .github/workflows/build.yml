name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            artifacts: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS x64 + arm64
            os: macos-latest
            script: dist:mac
            artifacts: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Optional signing and notarization. Unsigned builds still run when the
      # secrets are absent, so forks and pull requests produce usable artifacts.
      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          fi

      # Optional: stage local-models/nllb-200-3.3B-int8 before this step to
      # produce installers with the offline model embedded. See
      # local-models/README.md. Without it, Dodoi downloads the model on first use.
      - name: Build ${{ matrix.name }}
        run: npm run ${{ matrix.script }}
        env:
          # Separate secrets per platform: a Windows PFX and a macOS P12 cannot
          # share one CSC_LINK value.
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK != '') || (runner.os == 'macOS' && secrets.MACOS_CSC_LINK != '') }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER || '' }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dodoi-${{ runner.os }}-${{ github.run_number }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30
