name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # The secrets context is not available in step-level if expressions, so
    # expose only whether each platform certificate exists.
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CSC_LINK != '' }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            artifact: dodoi-windows-x64
            os: windows-latest
            script: dist:win
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS x64
            artifact: dodoi-macos-x64
            os: macos-15-intel
            script: dist:mac:x64
            files: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - name: macOS arm64
            artifact: dodoi-macos-arm64
            os: macos-15
            script: dist:mac:arm64
            files: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - name: Linux x64
            artifact: dodoi-linux-x64
            os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.AppImage.blockmap
              release/*.deb
              release/latest-linux.yml

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The runtime is downloaded per native runner and copied into the app by
      # electron-builder's extraResources entry. It is intentionally not in Git.
      - name: Provision bundled Python
        run: npm run python:provision

      # Optional signing and notarization. Unsigned builds still run when the
      # secrets are absent, so forks and pull requests produce usable artifacts.
      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          fi

      # Optional: stage local-models/nllb-200-3.3B-int8 before this step to
      # produce installers with the offline model embedded. See
      # local-models/README.md. Without it, Dodoi downloads the model on first use.
      # Separate secrets per platform: a Windows PFX and a macOS P12 cannot
      # share one CSC_LINK value. The signed and unsigned builds are split so
      # that an absent certificate leaves CSC_LINK undefined; electron-builder
      # treats an empty CSC_LINK as a file path on macOS and fails.
      - name: Build signed ${{ matrix.name }}
        if: (runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true') || (runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true')
        run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER || '' }}

      - name: Build unsigned ${{ matrix.name }}
        if: runner.os == 'Linux' || (runner.os == 'Windows' && env.HAS_WINDOWS_CERT != 'true') || (runner.os == 'macOS' && env.HAS_MACOS_CERT != 'true')
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify bundled Python runtime
        run: npm run verify:packaged

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only the manifest merger is needed here; skip Electron's postinstall.
      - name: Install manifest tooling
        run: npm ci --ignore-scripts

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dodoi-*

      - name: Assemble release assets
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find artifacts -type f ! -name 'latest-mac.yml' -exec cp -t dist-artifacts {} +
          node scripts/merge-update-manifests.cjs \
            dist-artifacts/latest-mac.yml \
            artifacts/dodoi-macos-x64/latest-mac.yml \
            artifacts/dodoi-macos-arm64/latest-mac.yml
          cd dist-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-artifacts/* --clobber
          else
            gh release create "$TAG" dist-artifacts/* \
              --verify-tag \
              --title "Dodoi $TAG" \
              --generate-notes
          fi
