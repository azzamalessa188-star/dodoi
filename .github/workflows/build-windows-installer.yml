name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to'
        required: true
        default: v0.2.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} release/Dodoi-Setup-0.2.0-x64.exe --clobber